{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>TechCovers</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .header-principal {
            background-color: #E8DDC9;
            min-height: 100px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .header-principal img {
            width: 230px;
            height: auto;
        }

        .buscador {
            flex: 1;
            display: flex;
            max-width: 550px;
        }

        .buscador input {
            width: 100%;
            padding: 10px;
            border: 1px solid #777;
        }

        .buscador button {
            background-color: #AECDD1;
            color: #1E2932;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        .reserva-header button {
            background-color: #AECDD1;
            color: #1E2932;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 800px) {

            .header-principal {
                flex-wrap: wrap;
                justify-content: center;
            }

            .header-principal img {
                width: 200px;
            }

            .buscador {
                width: 100%;
                max-width: none;
            }

            .reserva-header {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>

<body>

    <header>

        <div class="header-principal">

            <img src="{% static 'imagenes/logo_principal.png' %}" alt="TechCovers">

            <div class="buscador">
                <input type="text" placeholder="Buscar">
                <button>Buscar</button>
            </div>

            <div class="reserva-header">
                <button>Reservar</button>
            </div>

        </div>

    </header>

</body>

</html>
